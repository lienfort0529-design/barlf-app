<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bar LF 数字管理</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#1c2233">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bar LF">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { --bg:#f3f1ec; --card:#fff; --ink:#1f2230; --sub:#6e6c78; --line:#e2ded5; --brand:#1c2233; --brand2:#b8923f; --soft:#ece6d6;
    --good:#2f7d4f; --bad:#c0392b; --warn:#fdecea; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; -webkit-text-size-adjust:100%; }
  header { position:sticky; top:0; z-index:5; background:var(--brand); color:#fff; padding:calc(12px + env(safe-area-inset-top)) 16px 12px; font-weight:700; display:flex; align-items:center; }
  header #title { flex:1; }
  header #title::before { content:'LF'; color:var(--brand2); font-family:Georgia,serif; margin-right:8px; }
  header #who { font-weight:400; font-size:12px; opacity:.85; }
  .login { max-width:360px; margin:40px auto; text-align:center; }
  .login .logo { width:88px; height:88px; border-radius:22px; margin-bottom:8px; }
  .login input { text-align:center; font-size:24px; letter-spacing:.3em; }
  main { max-width:640px; margin:0 auto; padding:12px 12px 150px; }
  nav { position:fixed; bottom:0; left:0; right:0; z-index:6; display:flex; background:#fff; border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
  nav button { flex:1; border:0; background:none; padding:10px 0 12px; font-size:12px; color:var(--sub); }
  nav button b { display:block; font-size:18px; line-height:1.2; }
  nav button.on { color:var(--brand); font-weight:700; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; }
  .row { display:flex; align-items:center; gap:8px; }
  .grow { flex:1; min-width:0; }
  .sub { color:var(--sub); font-size:13px; }
  .num { font-variant-numeric:tabular-nums; }
  h2 { font-size:14px; color:var(--sub); margin:18px 4px 8px; font-weight:600; }
  input, select { font:inherit; font-size:16px; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; width:100%; color:var(--ink); }
  label { display:block; font-size:13px; color:var(--sub); margin:10px 0 4px; }
  .btn { font:inherit; border:0; border-radius:10px; padding:11px 14px; background:var(--brand); color:#fff; font-weight:700; }
  .btn.sec { background:var(--soft); color:var(--brand); }
  .btn.del { background:none; color:var(--bad); }
  .btn.wide { width:100%; }
  .btn:disabled { opacity:.5; }
  .chip { display:inline-block; padding:2px 8px; border-radius:99px; font-size:12px; font-weight:700; background:#e8f3ec; color:var(--good); }
  .chip.bad { background:var(--warn); color:var(--bad); }
  .chip.off { background:#eee; color:#888; }
  .chip.card { background:#e7ecf7; color:#2c4a8a; }
  .menu-item { display:flex; gap:10px; align-items:center; cursor:pointer; }
  .menu-item .stats { text-align:right; font-size:13px; }
  .over { border-color:#f1b5ad; background:#fffafa; }
  .toolbar { display:flex; gap:8px; margin-bottom:8px; }
  .toolbar select, .toolbar input { flex:1; }
  .kpi { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .kpi div { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .kpi small { display:block; color:var(--sub); font-size:12px; }
  .kpi strong { font-size:19px; }
  .kpi .big { grid-column:1 / -1; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { padding:6px 4px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; white-space:normal; }
  th { color:var(--sub); font-weight:600; }
  .bar { height:8px; background:var(--brand2); border-radius:4px; }
  .qty { display:flex; align-items:center; gap:6px; }
  .qty button { width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:#fff; font-size:20px; color:var(--brand); }
  .qty input { width:52px; text-align:center; padding:7px 4px; }
  .has { border-color:var(--brand2); background:#fffbf1; }
  .footer-bar { position:fixed; left:0; right:0; bottom:calc(58px + env(safe-area-inset-bottom)); z-index:5; background:#fff; border-top:1px solid var(--line); padding:10px 12px; }
  .footer-bar > div, .mfoot > div { max-width:640px; margin:0 auto; }
  #modal { position:fixed; inset:0; z-index:10; background:var(--bg); overflow:auto; display:none; }
  #modal.open { display:block; }
  #modal .head { position:sticky; top:0; z-index:2; background:var(--brand); color:#fff; padding:calc(10px + env(safe-area-inset-top)) 12px 10px; display:flex; align-items:center; gap:8px; }
  #modal .head button { background:none; border:0; color:#fff; font:inherit; font-size:15px; }
  #modal .body { max-width:640px; margin:0 auto; padding:12px 12px 140px; }
  .mfoot { position:fixed; left:0; right:0; bottom:0; z-index:11; background:#fff; border-top:1px solid var(--line); padding:10px 12px calc(10px + env(safe-area-inset-bottom)); }
  .line { display:grid; grid-template-columns:1fr 84px 34px; gap:6px; align-items:center; margin-bottom:6px; }
  .line .x { border:0; background:none; color:var(--bad); font-size:20px; }
  .line-cost { grid-column:1 / -1; font-size:12px; color:var(--sub); margin:-2px 0 6px 4px; }
  .summary { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; text-align:center; }
  .summary small { display:block; font-size:11px; color:var(--sub); }
  .summary strong { font-size:16px; }
  #toast { position:fixed; left:50%; top:60px; transform:translateX(-50%); background:#333; color:#fff; padding:9px 16px; border-radius:99px; font-size:14px; z-index:20; display:none; max-width:90%; }
  #loading { position:fixed; inset:0; background:rgba(255,255,255,.6); z-index:30; display:none; align-items:center; justify-content:center; font-weight:700; color:var(--brand); }
  .seg { display:flex; gap:6px; }
  .seg button { flex:1; border:1px solid var(--line); background:#fff; border-radius:10px; padding:9px 0; font:inherit; font-size:14px; color:var(--ink); }
  .seg button.on { border-color:var(--brand); background:var(--brand); color:#fff; font-weight:700; }
  .slip { cursor:pointer; }
  .slip .items { font-size:13px; color:var(--sub); margin-top:2px; }
  .chartbox { position:relative; height:220px; }
  .note { font-size:12px; color:var(--sub); margin-top:6px; }
  .up { color:var(--good); } .down { color:var(--bad); }
  .empty { text-align:center; color:var(--sub); padding:30px 10px; }
</style>
</head>
<body>
<header><span id="title">Bar LF</span><span id="who"></span></header>
<main id="main"></main>
<nav id="nav"></nav>
<div id="modal"></div>
<div id="toast"></div>
<div id="loading">読み込み中…</div>

<script>
// Apps Script を「ウェブアプリ」で公開したときの URL（/exec で終わるもの）
const API_URL = 'https://script.google.com/macros/s/AKfycbzn5OnJj6pM8dGyV7rumXB_QIREewoVr-I9kPAjFZV_fQbaZIf_fVgEnopyvyjMPBiQyw/exec';
const ALL_TABS = [['slip','🧾','伝票'],['report','📊','集計'],['menu','🍸','メニュー'],['mat','📦','在庫'],['set','⚙️','設定']];
const STAFF_TABS = ['slip', 'report', 'mat', 'set'];
const TOKEN_KEY = 'barlf_token';
let TABS = ALL_TABS;
const isOwner = () => D && D.me && D.me.role === 'owner';
const UNITS = ['ml','g','個'];
const MAT_CATS = ['ウイスキー','焼酎・日本酒','ビール','ワイン','スピリッツ・リキュール','割り材・氷','フード材料','消耗品','その他'];
let D = null, tab = 'slip', menuFilter = 'active', menuSort = 'cat', menuQuery = '';
let dayDate = null, day = null, reportMonth = null, purMonth = null, purList = [];

// ===== 共通 =====
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yenD = (n, d) => { const v = Math.round(Math.abs(n || 0) * 10 ** d) / 10 ** d; return (n < 0 && v ? '−¥' : '¥') + v.toLocaleString(undefined, { maximumFractionDigits: d }); };
const yen = n => yenD(n, 0);
const yen1 = n => yenD(n, 1);
const yenU = n => yenD(n, 2); // 材料の単価（1ml・1gあたり）
const pct = n => isFinite(n) ? (Math.round(n * 1000) / 10).toFixed(1) + '%' : '―';
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 2500); }
const store = {
  get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} },
};
async function call(fn, ...args) {
  $('#loading').style.display = 'flex';
  try {
    // text/plain で送ると Apps Script でもブラウザの事前確認（CORS）が要らない
    const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn, args, token: store.get(TOKEN_KEY) }) });
    const r = await res.json();
    if (r.ok) return r.data;
    if (r.code === 'auth') { store.set(TOKEN_KEY, null); showLogin(); }
    else alert(r.error);
    throw new Error(r.error);
  } catch (e) {
    if (e instanceof TypeError) alert('通信できませんでした。電波を確認してください');
    throw e;
  } finally { $('#loading').style.display = 'none'; }
}

// ===== 計算 =====
const taxRate = () => 1 + (D.settings['消費税率'] || 0);
const target = () => D.settings['目標原価率'] || 0.25;
const matById = id => D.materials.find(m => m.id === id);
const unitPrice = m => m && m.amount > 0 ? m.price / m.amount : 0;
const costOf = (lines, override) => (lines || []).reduce((a, l) => {
  const m = matById(l.matId);
  return a + (Number(l.qty) || 0) * (override && override.id === l.matId ? unitPrice(override) : unitPrice(m));
}, 0);
function metrics(price, cost) {
  const ex = price / taxRate(), gross = ex - cost;
  return { ex, cost, gross, costRate: ex > 0 ? cost / ex : NaN, grossRate: ex > 0 ? gross / ex : NaN };
}
const menuMetrics = m => metrics(m.price, costOf(D.recipes[m.id]));
const cats = list => [...new Set(list.map(x => x.cat || 'その他'))];

// ===== 画面切り替え =====
function renderNav() {
  TABS = isOwner() ? ALL_TABS : ALL_TABS.filter(t => STAFF_TABS.includes(t[0]));
  $('#who').textContent = D && D.me ? D.me.name + (isOwner() ? '（オーナー）' : '') : '';
  $('#nav').innerHTML = TABS.map(([k, i, n]) => `<button class="${k === tab ? 'on' : ''}" onclick="go('${k}')"><b>${i}</b>${n}</button>`).join('');
}
function go(k) {
  tab = k;
  $('#title').textContent = TABS.find(t => t[0] === k)[2];
  renderNav(); window.scrollTo(0, 0); render();
}
function render() {
  ({ slip: renderDay, menu: renderMenus, report: renderReport, mat: renderMats, set: renderSettings })[tab]();
}
function openModal(title, html, foot) {
  const m = $('#modal');
  m.innerHTML = `<div class="head"><button onclick="closeModal()">‹ 戻る</button><div class="grow" style="font-weight:700">${esc(title)}</div></div><div class="body">${html}</div>`
    + (foot ? `<div class="mfoot"><div>${foot}</div></div>` : '');
  m.classList.add('open'); m.scrollTop = 0;
}
function closeModal() { $('#modal').classList.remove('open'); $('#modal').innerHTML = ''; }

// ===== 伝票（1日の一覧） =====
async function loadDay(date) {
  day = await call('getDay', date); dayDate = date; renderDay();
}
function renderDay() {
  if (!day || day.date !== dayDate) return loadDay(dayDate || D.today);
  const s = day.slips, sum = k => s.reduce((a, x) => a + x[k], 0);
  const cash = s.filter(x => x.pay !== 'カード').reduce((a, x) => a + x.total, 0), card = sum('total') - cash;
  const guests = sum('guests');
  $('#main').innerHTML = `
    <div class="row"><input type="date" value="${dayDate}" onchange="loadDay(this.value)">
      <button class="btn sec" onclick="loadDay('${D.today}')" style="white-space:nowrap">今日</button></div>
    <div class="note">営業日：${D.settings['営業日の切り替え時刻']}時より前の会計は前の日の売上に入ります</div>
    <div class="kpi num" style="margin-top:10px">
      <div class="big"><small>この日の売上（税込）</small><strong>${yen(sum('total'))}</strong>
        <small>飲食代 ${yen(sum('food'))}　サービス料 ${yen(sum('service'))}</small></div>
      <div><small>💴 現金</small><strong>${yen(cash)}</strong></div>
      <div><small>💳 カード</small><strong>${yen(card)}</strong></div>
      <div><small>組数・客数</small><strong>${s.length}組 ${guests}人</strong></div>
      <div><small>客単価</small><strong>${guests ? yen(sum('total') / guests) : '―'}</strong></div>
    </div>
    <h2>伝票（${s.length}件）</h2>
    ${s.length ? s.map(x => `<div class="card slip" onclick="editSlip('${x.id}')">
      <div class="row"><b class="num">${esc(x.time)}</b><span class="sub">${x.guests}名・担当 ${esc(x.staffName)}</span>
        <span class="grow"></span><span class="chip ${x.pay === 'カード' ? 'card' : ''}">${esc(x.pay)}</span><b class="num">${yen(x.total)}</b></div>
      <div class="items">${x.items.map(i => esc(i.name) + (i.qty > 1 ? '×' + i.qty : '')).join('、')}${x.memo ? '　📝' + esc(x.memo) : ''}</div></div>`).join('')
      : '<div class="empty">この日の伝票はまだありません</div>'}
    <div class="footer-bar"><div><button class="btn wide" onclick="editSlip()">＋ 新しい伝票</button></div></div>`;
}

// ===== 伝票の入力 =====
let sl = null, slQuery = '';
function editSlip(id) {
  const x = id ? day.slips.find(s => s.id === id) : null;
  sl = x ? { id: x.id, date: x.date, guests: x.guests, staffId: x.staffId, pay: x.pay, memo: x.memo || '', rate: x.rate,
      qty: Object.fromEntries(x.items.map(i => [i.menuId, i.qty])), old: Object.fromEntries(x.items.map(i => [i.menuId, i])) }
    : { id: null, date: dayDate, guests: 1, staffId: D.me.id, pay: '', memo: '', rate: D.settings['サービス料率'] || 0, qty: {}, old: {} };
  slQuery = '';
  const staff = D.staff.slice();
  if (x && !staff.some(u => u.id === x.staffId)) staff.push({ id: x.staffId, name: x.staffName + '（停止中）' });
  openModal(x ? `伝票を修正（${x.time}）` : '新しい伝票', `
    <div class="row">
      <div style="width:150px"><label style="margin-top:0">人数</label><div class="qty"><button onclick="slGuests(-1)">−</button><input id="sGuests" type="number" inputmode="numeric" value="${sl.guests}" oninput="sl.guests=Number(this.value)||0"><button onclick="slGuests(1)">＋</button></div></div>
      <div class="grow"><label style="margin-top:0">担当</label><select onchange="sl.staffId=this.value">${staff.map(u => `<option value="${u.id}" ${u.id === sl.staffId ? 'selected' : ''}>${esc(u.name)}</option>`).join('')}</select></div>
    </div>
    <h2>注文</h2>
    <input placeholder="🔍 メニューを探す" oninput="slQuery=this.value;drawSlipMenus()" style="margin-bottom:8px">
    <div id="slMenus"></div>
    <h2>お会計</h2>
    <div class="card">
      <label style="margin-top:0">支払い</label><div class="seg" id="slPay"></div>
      <label>メモ</label><input value="${esc(sl.memo)}" placeholder="例：〇〇様、ボトルキープ" oninput="sl.memo=this.value">
      ${id ? '' : '<div class="row" style="margin-top:6px"><span class="sub grow">営業日</span><input type="date" style="width:170px" value="' + sl.date + '" onchange="sl.date=this.value"></div>'}
    </div>
    ${x ? `<div class="row" style="margin-top:4px"><span class="sub grow">営業日を直す</span><input type="date" style="width:170px" value="${sl.date}" onchange="sl.date=this.value"></div>
      <button class="btn del wide" style="margin-top:10px" onclick="delSlip('${x.id}')">この伝票を削除</button>` : ''}`,
    `<div class="row"><div class="grow num" id="slTotal"></div><button class="btn" onclick="saveSlipEd()">${x ? '修正する' : '会計を保存'}</button></div>`);
  drawSlipMenus(); drawPay(); updSlip();
}
function slGuests(d) { sl.guests = Math.max(0, (Number(sl.guests) || 0) + d); $('#sGuests').value = sl.guests; }
// 伝票に出すメニュー：販売中のもの＋この伝票にすでにある品（休止・削除されたものも）
function slipMenus() {
  const list = D.menus.filter(m => m.active || sl.qty[m.id]).map(m => ({ id: m.id, name: m.name, cat: m.cat, price: sl.old[m.id] ? sl.old[m.id].price : m.price }));
  Object.values(sl.old).forEach(i => { if (!list.some(m => m.id === i.menuId)) list.push({ id: i.menuId, name: i.name, cat: '以前のメニュー', price: i.price }); });
  return list;
}
function drawSlipMenus() {
  const q = slQuery.trim();
  const list = slipMenus().filter(m => !q || (m.name + (m.cat || '')).includes(q));
  $('#slMenus').innerHTML = list.length ? cats(list).map(c => `<h2>${esc(c)}</h2>` + list.filter(m => (m.cat || 'その他') === c).map(m => `
    <div class="card row ${sl.qty[m.id] ? 'has' : ''}" id="sm_${m.id}"><div class="grow"><div style="font-weight:700">${esc(m.name)}</div><div class="sub num">${yen(m.price)}</div></div>
      <div class="qty"><button onclick="addSlQty('${m.id}',-1)">−</button><input id="sq_${m.id}" type="number" inputmode="numeric" value="${sl.qty[m.id] || ''}" placeholder="0" oninput="setSlQty('${m.id}',this.value)"><button onclick="addSlQty('${m.id}',1)">＋</button></div></div>`).join('')).join('')
    : `<div class="empty">${D.menus.length ? '見つかりません' : 'メニューがまだありません。オーナーが「メニュー」タブで登録してください'}</div>`;
}
function drawPay() {
  $('#slPay').innerHTML = ['現金', 'カード'].map(p => `<button class="${sl.pay === p ? 'on' : ''}" onclick="sl.pay='${p}';drawPay()">${p === '現金' ? '💴' : '💳'} ${p}</button>`).join('');
}
function setSlQty(id, v) {
  sl.qty[id] = Math.max(0, Math.floor(Number(v) || 0));
  const el = $('#sm_' + id); if (el) el.classList.toggle('has', sl.qty[id] > 0);
  updSlip();
}
function addSlQty(id, d) { setSlQty(id, (sl.qty[id] || 0) + d); $('#sq_' + id).value = sl.qty[id] || ''; }
function slipCalc() {
  const price = Object.fromEntries(slipMenus().map(m => [m.id, m.price]));
  let n = 0, food = 0;
  Object.entries(sl.qty).forEach(([id, q]) => { if (q > 0 && id in price) { n += q; food += q * price[id]; } });
  const service = Math.round(food * sl.rate);
  return { n, food, service, total: food + service };
}
function updSlip() {
  const c = slipCalc();
  $('#slTotal').innerHTML = `<div class="sub">${c.n}品　飲食代 ${yen(c.food)}${sl.rate ? `＋サービス料${pct(sl.rate)} ${yen(c.service)}` : ''}</div><b style="font-size:18px">合計 ${yen(c.total)}</b>`;
}
async function saveSlipEd() {
  if (!slipCalc().n) return alert('注文を1つ以上入れてください');
  if (!sl.pay) return alert('支払い（現金・カード）を選んでください');
  if (!sl.date) return alert('営業日を入れてください');
  const items = Object.keys(sl.qty).filter(id => sl.qty[id] > 0).map(id => ({ menuId: id, qty: sl.qty[id] }));
  const r = await call('saveSlip', { id: sl.id, date: sl.date, guests: sl.guests, staffId: sl.staffId, pay: sl.pay, memo: sl.memo, items });
  day = r; dayDate = r.date; closeModal(); renderDay(); toast(sl.id ? '修正しました' : '会計を保存しました');
}
async function delSlip(id) {
  if (!confirm('この伝票を削除しますか？（元に戻せません）')) return;
  day = await call('deleteSlip', id); closeModal(); renderDay(); toast('削除しました');
}

// ===== メニュー一覧 =====
function renderMenus() {
  let list = D.menus.filter(m => menuFilter === 'all' || (menuFilter === 'active') === m.active);
  if (menuQuery) list = list.filter(m => (m.name + m.cat).includes(menuQuery));
  const rows = list.map(m => ({ m, k: menuMetrics(m) }));
  if (menuSort === 'rate') rows.sort((a, b) => (b.k.costRate || 0) - (a.k.costRate || 0));

const ymShift = (ym, k) => { const d = new Date(Number(ym.slice(0, 4)), Number(ym.slice(5)) - 1 + k, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const daysIn = ym => new Date(Number(ym.slice(0, 4)), Number(ym.slice(5)), 0).getDate();
const ymLabel = ym => Number(ym.slice(5)) + '月';
const DOW = ['日', '月', '火', '水', '木', '金', '土'];
const dow = date => new Date(Number(date.slice(0, 4)), Number(date.slice(5, 7)) - 1, Number(date.slice(8))).getDay();
let charts = {};
function chart(id, cfg) {
  if (charts[id]) charts[id].destroy();
  const el = document.getElementById(id);
  if (!el || !window.Chart) return;
  cfg.options = Object.assign({ responsive: true, maintainAspectRatio: false, animation: false,
    plugins: { legend: { labels: { boxWidth: 12, font: { size: 11 } } } },
    scales: { y: { beginAtZero: true, ticks: { font: { size: 10 }, callback: v => Math.abs(v) >= 10000 ? v / 10000 + '万' : v.toLocaleString() } }, x: { ticks: { font: { size: 10 } } } } }, cfg.options || {});
  charts[id] = new Chart(el, cfg);
}
function sumDays(days, ym, upTo) {
  const s = { total: 0, food: 0, service: 0, cost: 0, labor: 0, slips: 0, guests: 0, cash: 0, card: 0, n: 0 };
  days.forEach(d => {
    if (d.date.slice(0, 7) !== ym || (upTo && Number(d.date.slice(8)) > upTo) || !(d.total > 0)) return;
    ['total', 'food', 'service', 'cost', 'labor', 'slips', 'guests', 'cash', 'card'].forEach(k => s[k] += d[k]); s.n++;
  });
  s.ex = s.total / taxRate(); s.gross = s.ex - s.cost; s.profit = s.gross - s.labor; // 粗利 − 人件費（固定費の前）
  return s;
}
const diff = (a, b) => b > 0 ? `<span class="${a >= b ? 'up' : 'down'}">${a >= b ? '+' : ''}${pct(a / b - 1)}</span>` : '<span class="sub">比較データなし</span>';
function avgBy(days, keyFn, keys) {
  const g = {};
  days.filter(d => d.total > 0).forEach(d => { const k = keyFn(d); (g[k] = g[k] || []).push(d.total); });
  return keys.map(k => ({ k, n: (g[k] || []).length, avg: g[k] ? g[k].reduce((a, b) => a + b, 0) / g[k].length : 0 }));
}
// 販売中メニューの平均原価率（伝票がまだない月の損益分岐点に使う）
function menuAvgRate() {
  const k = D.menus.filter(m => m.active).map(menuMetrics).filter(x => isFinite(x.costRate));
  return k.length ? k.reduce((a, x) => a + x.costRate, 0) / k.length : 0;
}

  chart('cDow', { type: 'bar', data: { labels: byDow.map(x => DOW[x.k]), datasets: [{ label: '平均売上', data: byDow.map(x => Math.round(x.avg)),

    options: { plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => `${yen(c.raw)}（${byDow[c.dataIndex].n}日の平均）` } } } } });

  ] }, options: { plugins: { tooltip: { callbacks: { label: c => c.dataset.label + ' ' + yen(c.raw) } } } } });
}

// ===== 在庫（在庫一覧・棚卸・仕入れの記録・酒と食材の単価） =====

      ${purList.length ? `<table style="margin-top:6px">${purList.map(p => `<tr onclick="editPur('${p.id}')" style="cursor:pointer"><td>${Number(p.date.slice(8))}日 ${esc(p.shop)}

// 棚卸：入れた品だけ保存する。開いているボトルは目分量で（例：0.4）
let tk = {};
function openStocktake() {

  if (!items.length) return alert('先に酒・食材を登録してください');
  openModal('棚卸', `
    <label style="margin-top:0">日付（その日の営業が終わったあとの数）</label><input id="tkDate" type="date" value="${D.today}">
    <div class="note">数えた品だけ入れてください（空のままの品は保存しません）。開いているボトルは残りを目分量で 0.1 単位（半分なら 0.5）</div>
    ${cats(items).map(c => `<h2>${esc(c)}</h2>` + items.filter(i => (i.cat || 'その他') === c).map(i => `
      <div class="card row"><div class="grow"><div style="font-weight:700">${esc(i.name)}</div><div class="sub num">計算上 ${n1(i.calc)}${esc(i.box)}</div><div class="sub num" id="tkd_${i.id}"></div></div>
        <div style="width:110px" class="row"><input type="number" inputmode="decimal" step="0.1" min="0" placeholder="${n1(i.calc)}" oninput="setTk('${i.id}',this.value)"><span class="sub">${esc(i.box)}</span></div></div>`).join('')).join('')}`,
    `<div class="row"><div class="grow sub" id="tkCount">0品入力</div><button class="btn" onclick="saveTk()">棚卸を保存</button></div>`);

function setTk(id, v) {

  el.innerHTML = d == null ? '' : `差 <b style="color:${d < 0 ? 'var(--bad)' : 'var(--good)'}">${d > 0 ? '+' : ''}${n1(d)}${esc(i.box)}</b>${isOwner() && d ? `（${yen(d * i.price)}）` : ''}`;
  $('#tkCount').textContent = Object.keys(tk).length + '品入力';
}
async function saveTk() {
  const n = Object.keys(tk).length;
  if (!n) return alert('数を1つ以上入れてください');
  const date = $('#tkDate').value;
  stock = await call('saveStocktake', date, tk);
  closeModal(); render(); toast(`${n}品の棚卸を保存しました`);
}

// 仕入れ：品と数と金額（品ごとの合計）。明細にない分は「その他」に

function drawPurLines() {
  $('#pLines').innerHTML = pe.lines.map((l, i) => {
    const m = matById(l.matId);
    return `<div class="card" style="padding:8px"><div class="row"><select class="grow" onchange="pe.lines[${i}].matId=this.value;drawPurLines()">${matOptions(l.matId)}</select>
        <button class="btn del" style="padding:6px" onclick="pe.lines.splice(${i},1);drawPurLines()">×</button></div>
      <div class="row" style="margin-top:6px"><input type="number" inputmode="decimal" step="0.1" placeholder="数" value="${l.qty}" oninput="pe.lines[${i}].qty=this.value;updPur()" style="width:90px"><span class="sub">${m ? esc(m.box) : ''}</span>
        <input type="number" inputmode="numeric" placeholder="金額（円）" value="${l.amount}" oninput="pe.lines[${i}].amount=this.value;updPur()" class="grow"></div>
      <div class="sub num" id="pl${i}"></div></div>`;
  }).join('');

}
function updPur() {
  pe.lines.forEach((l, i) => { const m = matById(l.matId), el = $('#pl' + i), q = Number(l.qty), a = Number(l.amount);
    if (el) el.innerHTML = m && q > 0 && a > 0 ? `1${esc(m.box)} ${yen(a / q)}（今の登録 ${yen(m.price)}）` + (Math.round(a / q) !== m.price ? ' → 原価に反映' : '') : ''; });
  const total = pe.lines.reduce((s, l) => s + (Number(l.amount) || 0), 0) + (Number(pe.other) || 0);
  $('#pTotal').innerHTML = `<span class="sub">合計</span> <b style="font-size:18px">${yen(total)}</b>`;
}
async function savePur() {
  const lines = pe.lines.filter(l => l.matId && Number(l.qty) > 0).map(l => ({ matId: l.matId, qty: Number(l.qty), amount: Number(l.amount) || 0 }));
  if (pe.lines.some(l => l.matId && !(Number(l.qty) > 0))) return alert('数を入れていない品があります');
  const p = { id: pe.id, date: $('#pDate').value, shop: $('#pShop').value.trim(), what: $('#pWhat').value.trim(), lines, other: Number(pe.other) || 0 };
  if (!p.date) return alert('日付を入れてください');
  if (!(lines.reduce((s, l) => s + l.amount, 0) + p.other > 0)) return alert('金額を入れてください');
  const r = await call('savePurchase', p); D = r.all; purList = r.list; purMonth = p.date.slice(0, 7);
  closeModal(); render(); toast('保存しました（在庫に反映）');
}
async function delPur(id) {

}

    <label>権限</label><select id="uRole"><option value="staff">スタッフ（伝票入力と売上の集計だけ）</option><option value="owner" ${u.role === 'owner' ? 'selected' : ''}>オーナー（すべて）</option></select>
    <label>${id ? '新しい暗証番号（変えないときは空のまま）' : '暗証番号（4〜8桁の数字）'}</label><input id="uPin" type="password" inputmode="numeric" autocomplete="new-password">
    ${id ? `<label>状態</label><select id="uActive"><option value="1">使える</option><option value="0" ${u.active ? '' : 'selected'}>停止（辞めた人など。ログインできなくなる）</option></select>` : ''}
    <div class="note">暗証番号は暗号化して保存するため、あとから見ることはできません。忘れたら新しい番号を入れ直してください</div>
    <button class="btn wide" style="margin-top:12px" onclick="saveStaffEd('${id || ''}')">保存する</button>`);
}
async function saveStaffEd(id) {
  const s = { id, name: $('#uName').value.trim(), role: $('#uRole').value, pin: $('#uPin').value.trim(), active: id ? $('#uActive').value === '1' : true };
  if (!s.name) return alert('名前を入れてください');
  if ((!id || s.pin) && !/^\d{4,8}$/.test(s.pin)) return alert('暗証番号は4〜8桁の数字にしてください');
  drawStaff(await call('saveStaff', s)); closeModal(); toast('保存しました');
  D = await call('getAll'); // 伝票の「担当」の一覧も新しくする
}

// ===== ログイン =====
async function showLogin() {
  D = null; closeModal(); $('#nav').innerHTML = ''; $('#who').textContent = ''; $('#title').textContent = 'Bar LF';
  const st = await call('status');
  $('#main').innerHTML = `<div class="login"><img class="logo" src="icon-180.png" alt="">` + (st.needsSetup ? `
    <h3>はじめの設定</h3><p class="sub">オーナーの名前と暗証番号を決めてください</p>
    <input id="lName" placeholder="名前" style="letter-spacing:0;font-size:18px">
    <input id="lPin" type="password" inputmode="numeric" placeholder="暗証番号（4〜8桁）" style="margin-top:8px" autocomplete="new-password">
    <input id="lPin2" type="password" inputmode="numeric" placeholder="もう一度" style="margin-top:8px" autocomplete="new-password">
    <button class="btn wide" style="margin-top:12px" onclick="setupOwner()">登録してはじめる</button>` : `
    <p class="sub">暗証番号を入れてください</p>
    <input id="lPin" type="password" inputmode="numeric" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    <button class="btn wide" style="margin-top:12px" onclick="login()">ログイン</button>`) + '</div>';
}
async function login() {
  const r = await call('login', $('#lPin').value.trim());
  store.set(TOKEN_KEY, r.token); boot();
}
async function setupOwner() {
  const name = $('#lName').value.trim(), pin = $('#lPin').value.trim();
  if (!name) return alert('名前を入れてください');
  if (!/^\d{4,8}$/.test(pin)) return alert('暗証番号は4〜8桁の数字にしてください');
  if (pin !== $('#lPin2').value.trim()) return alert('暗証番号が一致しません');
  const r = await call('setupOwner', name, pin);
  store.set(TOKEN_KEY, r.token); boot();
}
async function logout() {
  if (!confirm('ログアウトしますか？')) return;
  await call('logout').catch(() => {});
  store.set(TOKEN_KEY, null); showLogin();
}

// ===== 起動 =====
async function boot() {
  if (!API_URL) { $('#main').innerHTML = '<div class="empty">API_URL が未設定です（仕組み.md の公開手順を参照）</div>'; return; }
  if (!store.get(TOKEN_KEY)) return showLogin();
  D = await call('getAll');
  dayDate = D.today; day = null; reportMonth = null; purMonth = null;
  go('slip');
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
boot();
</script>
</body>
